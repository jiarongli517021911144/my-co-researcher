[project]
name = "coresearcher"
version = "0.1.0"
description = "Async personal AI assistant framework with CLI, web UI, tools, memory, and channel adapters"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["agent", "ai-assistant", "asyncio", "cli", "feishu", "qq", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "chromadb>=1.5.2; python_version < '3.14'",
  "croniter>=6.0.0",
  "httpx>=0.28.1",
  "json-repair>=0.52.0",
  "litellm>=1.61.20",
  "loguru>=0.7.3",
  "oauth-cli-kit>=0.1.0",
  "openai>=1.65.4",
  "pydantic>=2.10.6",
  "uvicorn>=0.30.0",
  "starlette>=0.47.0",
  "tiktoken>=0.9.0",
  "typer>=0.15.2",
]

[project.optional-dependencies]
feishu = [
  "lark-oapi>=1.5.3",
]
qq = [
  "qq-botpy>=1.2.1",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]

[project.scripts]
coresearcher = "coresearcher.cli.commands:app"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["coresearcher*", "providers*"]

[tool.setuptools.package-data]
coresearcher = [
  "webapp/static/*.html",
  "webapp/static/*.js",
  "webapp/static/*.css",
  "workspace/templates/*.md",
  "workspace/templates/memory/*.md",
]
